<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3C Production Manager</title>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pipeline-board.css">
<script src="config.js"></script>
</head>
<body>

<div style="width:100%; text-align:right; padding: 3px 16px; font-size: 0.65rem; opacity: 0.5; letter-spacing: 0.02em; pointer-events: none;">
    Designed and Built with ❤️ by Claude (Anthropic) × Chef Anica · 3C Thread To Success™ Cooking Lab 🧪👨‍🍳
</div>

<header class="header">
    <div class="logo-section">
        <img src="public/3C%20Thread%20To%20Success%20logo.png" alt="3C Thread To Success" class="logo">
        <span class="title">3C Production Manager</span>
    </div>
    <div class="main-tabs">
        <button id="mainTabBtn-tasks" class="main-tab-btn active" onclick="switchMainTab('tasks')">Tasks</button>
        <button id="mainTabBtn-pipeline" class="main-tab-btn" onclick="switchMainTab('pipeline')">Pipeline</button>
    </div>
</header>

<div class="container">

    <!-- ── Tasks tab ─────────────────────────────────────── -->
    <div id="tasksTab">
        <div style="display:flex; gap:8px; margin-bottom:1rem;">
            <input type="text" id="newTaskTitle" class="form-input" placeholder="New task...">
            <input type="date" id="newTaskDue" class="form-input" style="max-width:160px;">
            <button class="btn btn-add" onclick="addTask()">+ Add</button>
        </div>
        <div id="taskList"></div>
    </div>

    <!-- ── Pipeline tab ──────────────────────────────────── -->
    <div id="pipelineTab" style="display:none;">
        <div id="platformTabs" class="platform-tabs"></div>
        <div class="week-nav">
            <button class="week-nav-btn" onclick="changeWeek(-1)">←</button>
            <span id="weekLabel" class="week-label"></span>
            <button class="week-nav-btn" onclick="changeWeek(1)">→</button>
            <button class="btn btn-ghost" style="margin-left:auto;" onclick="openExportView()">View / export</button>
        </div>
        <div id="stageBoard" class="stage-board"></div>
    </div>

</div>

<!-- ── Checklist detail panel ─────────────────────────────── -->
<div id="detailOverlay" class="detail-overlay" onclick="closeChecklistPanel()"></div>
<div id="detailPanel" class="detail-panel">
    <div class="detail-panel-header">
        <h3 id="detailTitle"></h3>
        <button class="detail-panel-close" onclick="closeChecklistPanel()">✕</button>
    </div>
    <div id="detailChecklist"></div>
    <div id="scheduleSubsteps" class="schedule-substeps" style="display:none;"></div>
    <div id="archiveBlock" style="display:none;"></div>
</div>

<!-- ── Add Platform modal ──────────────────────────────────── -->
<div id="addPlatformModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:1rem;">Add platform / content type</h3>
        <input type="text" id="newPlatformName" class="form-input" placeholder="Name, e.g. Instagram Reel" style="margin-bottom:10px;">
        <textarea id="newPlatformChecklist" class="form-textarea" rows="3" placeholder="Checklist steps, comma-separated, e.g. Film, Edit, Schedule, Publish, Archive" style="margin-bottom:10px;"></textarea>
        <label style="display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:0.85rem;">
            <input type="checkbox" id="newPlatformNeedsArchive" checked> Needs an Archive step
        </label>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="saveNewPlatform()">Save</button>
            <button class="btn btn-ghost" onclick="closeAddPlatformModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- ── Add Content modal ───────────────────────────────────── -->
<div id="addContentModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:1rem;">Add content</h3>
        <select id="newContentTemplate" class="form-select" style="margin-bottom:10px;"></select>
        <input type="text" id="newContentTitle" class="form-input" placeholder="Title" style="margin-bottom:10px;">
        <div style="display:flex; gap:8px; margin-bottom:14px;">
            <input type="date" id="newContentDate" class="form-input">
            <input type="time" id="newContentTime" class="form-input">
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="saveNewContent()">Save</button>
            <button class="btn btn-ghost" onclick="closeAddContentModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- ── Export modal ────────────────────────────────────────── -->
<div id="exportModal" class="modal">
    <div class="modal-content" style="max-width:640px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
            <h3>Published this week</h3>
            <button class="detail-panel-close" onclick="closeExportModal()">✕</button>
        </div>
        <div id="exportModalBody"></div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/tasksAPI.js"></script>
<script src="js/pipelineAPI.js"></script>
<script src="js/weeklyBoard.js"></script>
<script src="js/checklistPanel.js"></script>
<script src="js/archiveExport.js"></script>
<script src="js/app.js"></script>
</body>
</html>
