<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3C Production Manager</title>
<link rel="icon" type="image/png" href="public/favicon.png">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/pipeline-board.css">
<script src="config.js"></script>
</head>
<body>

<div style="width:100%; text-align:right; padding: 3px 16px; font-size: 0.65rem; opacity: 0.5; letter-spacing: 0.02em; pointer-events: none;">
    Designed and Built with ❤️ by Claude (Anthropic) × Chef Anica · 3C Thread To Success™ Cooking Lab 🧪👨‍🍳
</div>

<header class="header">
    <div class="logo-section">
        <img src="public/3C%20Thread%20To%20Success%20logo.png" alt="3C Thread To Success" class="logo">
        <span class="title">3C Production Manager</span>
    </div>
    <div class="main-tabs">
        <button id="mainTabBtn-tasks" class="main-tab-btn active" onclick="switchMainTab('tasks')">Tasks</button>
        <button id="mainTabBtn-pipeline" class="main-tab-btn" onclick="switchMainTab('pipeline')">Pipeline</button>
        <button class="btn btn-ghost" onclick="signOut()" title="Sign out">Sign out</button>
    </div>
</header>

<div class="container">

    <!-- ── Tasks tab — a diary, one day at a time ──────────── -->
    <div id="tasksTab">
        <div class="tasks-top-row">
            <div class="tasks-top-left">
                <div class="week-nav">
                    <button class="week-nav-btn" onclick="changeTasksWeek(-1)">←</button>
                    <span id="tasksWeekLabel" class="week-label"></span>
                    <button class="week-nav-btn" onclick="changeTasksWeek(1)">→</button>
                </div>
                <button class="add-note-toggle" onclick="openNoteSidebar()">+ ADD</button>
                <button class="index-toggle" onclick="openIndexSidebar()">INDEX</button>
            </div>
            <div id="tasksMiniCalendar" class="mini-calendar"></div>
        </div>

        <div id="diaryEntryList"></div>
    </div>

    <!-- ── Pipeline tab — per platform, fully independent ──── -->
    <div id="pipelineTab" style="display:none;">
        <div id="platformTabs" class="platform-tabs"></div>

        <div class="pipeline-top-row">
            <div class="pipeline-top-left">
                <div class="week-nav">
                    <button class="week-nav-btn" onclick="changeWeek(-1)">←</button>
                    <span id="weekLabel" class="week-label"></span>
                    <button class="week-nav-btn" onclick="changeWeek(1)">→</button>
                </div>
                <div id="stageCounters" class="stage-counters"></div>
            </div>
            <div id="miniCalendar" class="mini-calendar"></div>
        </div>

        <div class="pipeline-actions-row">
            <button class="btn btn-add" onclick="openAddTaskModal()">+ Add Task</button>
            <button class="btn btn-ghost" onclick="openExportView()">View / export</button>
        </div>

        <div id="pipelineItemList" class="pipeline-item-list"></div>
    </div>

</div>

<!-- ── Unified detail panel — add-task mode and edit mode ─── -->
<div id="detailOverlay" class="detail-overlay" onclick="closeChecklistPanel()"></div>
<div id="detailPanel" class="detail-panel">
    <div class="detail-panel-header">
        <h3 id="detailTitle"></h3>
        <button class="detail-panel-close" onclick="closeChecklistPanel()">✕</button>
    </div>
    <div id="detailDateTime" style="display:none; gap:8px; margin-bottom:14px;">
        <input type="date" id="taskDateInput" class="form-input">
        <input type="time" id="taskTimeInput" class="form-input">
    </div>
    <div id="detailChecklist"></div>
    <button id="detailSaveBtn" class="btn btn-primary" style="display:none; width:100%; margin-top:12px;" onclick="saveTaskDetails()">Add Task</button>
    <div id="scheduleSubsteps" class="schedule-substeps" style="display:none;"></div>
    <div id="archiveBlock" style="display:none;"></div>
</div>

<!-- ── Note sidebar — slides from the LEFT, add/edit sticky notes ── -->
<div id="noteSidebarOverlay" class="detail-overlay" onclick="closeNoteSidebar()"></div>
<div id="noteSidebar" class="note-sidebar">
    <div class="detail-panel-header">
        <h3 id="noteSidebarTitle">New Sticky Note</h3>
        <button class="detail-panel-close" onclick="closeNoteSidebar()">✕</button>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:14px;">
        <input type="date" id="noteDateInput" class="form-input">
        <input type="time" id="noteTimeInput" class="form-input">
    </div>
    <textarea id="noteTitleInput" class="form-textarea note-title-input" rows="2" placeholder="Title..."></textarea>
    <div class="note-description-label">Description</div>
    <div id="noteDescriptionEditor" class="note-description-editor"></div>
    <div class="note-sidebar-actions">
        <button class="icon-btn-round" onclick="closeNoteSidebar()" title="Cancel">✕</button>
        <button class="icon-btn-round icon-btn-round--save" onclick="saveStickyNoteFromSidebar()" title="Save">✓</button>
    </div>
</div>

<!-- ── Index sidebar — slides from the RIGHT, independent of the note sidebar ── -->
<div id="indexSidebarOverlay" class="detail-overlay" onclick="closeIndexSidebar()"></div>
<div id="indexSidebar" class="index-sidebar">
    <div class="detail-panel-header">
        <h3>This Week's Notes</h3>
        <button class="detail-panel-close" onclick="closeIndexSidebar()">✕</button>
    </div>
    <div id="indexList"></div>
</div>

<!-- ── Add Platform modal — its own editable checklist ─────── -->
<div id="addPlatformModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom:1rem;">Add platform</h3>
        <input type="text" id="newPlatformName" class="form-input" placeholder="Name, e.g. Instagram" style="margin-bottom:14px;">
        <div id="newPlatformChecklistEditor"></div>
        <div style="display:flex; gap:8px; margin-top:14px;">
            <button class="btn btn-primary" onclick="saveNewPlatform()">Save</button>
            <button class="btn btn-ghost" onclick="closeAddPlatformModal()">Cancel</button>
        </div>
    </div>
</div>

<!-- ── Export modal ────────────────────────────────────────── -->
<div id="exportModal" class="modal">
    <div class="modal-content" style="max-width:640px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:1rem;">
            <h3>Published this week</h3>
            <button class="detail-panel-close" onclick="closeExportModal()">✕</button>
        </div>
        <div id="exportModalBody"></div>
    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/tasksAPI.js"></script>
<script src="js/pipelineAPI.js"></script>
<script src="js/weeklyBoard.js"></script>
<script src="js/checklistPanel.js"></script>
<script src="js/archiveExport.js"></script>
<script src="js/app.js"></script>
</body>
</html>
