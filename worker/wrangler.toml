name = "3c-production-manager"
main = "index.js"
compatibility_date = "2026-08-17"

# Only the custom domain serves this Worker. The workers.dev addresses stay off.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "productionmanager.threadcommand.center", custom_domain = true }
]

# No [vars] and no secrets: login is checked against Supabase (public URL and
# anon key sit in index.js).

[[d1_databases]]
binding = "PRODUCTION_DB"
database_name = "3c-production-manager-db"
database_id = "6cb8cb43-1bc3-4adb-90cb-299e7dd852ab"

[triggers]
crons = ["0 14 * * *"]
